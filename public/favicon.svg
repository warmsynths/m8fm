<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#101010"/>
  <g transform="translate(11.65, 0) skewX(-20)">
    <!-- Waveform drawn first so joints are covered by outer box -->
    <path d="M 12 32 L 26 12 L 38 52 L 52 32" fill="none" stroke="#e2e0dc" stroke-width="8" stroke-linejoin="bevel"/>
    <!-- Outer box drawn second to ensure perfectly sharp external corners -->
    <rect x="12" y="12" width="40" height="40" fill="none" stroke="#e2e0dc" stroke-width="8" stroke-linejoin="miter"/>
  </g>
</svg>